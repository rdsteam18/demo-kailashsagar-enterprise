        class AdminController {
            constructor() {
                this.currentTab = 'dashboard';
                this.rfqFilter = 'All';

                if (!localStorage.getItem('ks_products')) {
                    localStorage.setItem('ks_products', JSON.stringify(DEFAULT_PRODUCTS));
                }
                if (!localStorage.getItem('ks_categories')) {
                    localStorage.setItem('ks_categories', JSON.stringify(DEFAULT_CATEGORIES));
                }
                if (!localStorage.getItem('ks_rfqs')) {
                    localStorage.setItem('ks_rfqs', JSON.stringify(DEFAULT_RFQS));
                }
            }

            isAuthenticated() {
                return sessionStorage.getItem('ks_admin_auth') === 'true';
            }

            getProducts() {
                return JSON.parse(localStorage.getItem('ks_products')) || [];
            }

            saveProducts(products) {
                localStorage.setItem('ks_products', JSON.stringify(products));
            }

            getCategories() {
                return JSON.parse(localStorage.getItem('ks_categories')) || [];
            }

            saveCategories(cats) {
                localStorage.setItem('ks_categories', JSON.stringify(cats));
            }

            getRfqs() {
                return JSON.parse(localStorage.getItem('ks_rfqs')) || [];
            }

            saveRfqs(rfqs) {
                localStorage.setItem('ks_rfqs', JSON.stringify(rfqs));
            }

            switchTab(tab) {
                this.currentTab = tab;
                this.render();
            }

            render() {
                const container = document.getElementById('admin-app');
                if (!container) return;

                if (!this.isAuthenticated()) {
                    container.innerHTML = this.renderLogin();
                } else {
                    container.innerHTML = `
                        ${this.renderHeader()}
                        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            ${this.renderCurrentView()}
                        </main>
                        ${this.renderFooter()}
                    `;
                }
            }

                return `
                    <div class="flex-grow flex items-center justify-center p-4 bg-slate-100">
                        <div class="max-w-md w-full bg-white border border-slate-300 rounded-lg p-8 shadow-sm">
                            <div class="text-center mb-6">

                            </div>

                                </div>
                                <div>
                                    <label class="block text-slate-700 font-bold mb-1">Password</label>
                                    <input type="password" id="login-password" required placeholder="Enter password" class="w-full bg-slate-50 border border-slate-300 rounded p-2.5 text-xs outline-none focus:border-navy text-slate-800">
                                </div>
                                <button type="submit" class="w-full bg-navy hover:bg-navy-dark text-white font-bold py-3 rounded text-xs transition shadow-sm">
                                    Authenticate & Access Portal
                                </button>
                            </form>
                            
                            <div class="mt-6 pt-4 border-t border-slate-200 text-center">
                                <a href="index.html" class="text-xs text-slate-500 hover:text-navy underline">
                                    &larr; Back to Wholesale Catalog
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }

                return `
                    <header class="bg-navy text-white border-b border-navy-dark sticky top-0 z-40 shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                                        KS
                                    </div>
                                    <div>

                                    <button onclick="admin.switchTab('products')" class="px-3.5 py-2 rounded font-medium transition ${this.currentTab === 'products' ? 'bg-orange-600 text-white font-bold shadow-xs' : 'text-slate-300 hover:text-white hover:bg-navy-light'}">
                                        <i class="fa-solid fa-boxes-stacked mr-1.5"></i> Products
                                    </button>
                                    <button onclick="admin.switchTab('categories')" class="px-3.5 py-2 rounded font-medium transition ${this.currentTab === 'categories' ? 'bg-orange-600 text-white font-bold shadow-xs' : 'text-slate-300 hover:text-white hover:bg-navy-light'}">
                                        <i class="fa-solid fa-folder-tree mr-1.5"></i> Categories

                            </div>

                    case 'products':

                    case 'categories':
                        return this.renderCategoriesView();
                    case 'rfqs':
                        return this.renderRfqsView();
                    default:

                                                <td class="p-3 font-bold text-slate-800">${r.company}</td>

                            <div>
                                <h2 class="text-xl font-bold text-navy tracking-tight">Wholesale Products Management</h2>
                                <p class="text-xs text-slate-500 mt-0.5">Maintain catalog inventory, MOQ thresholds, and product variants.</p>
                            </div>
                            <button onclick="openProductModal()" class="bg-navy hover:bg-navy-dark text-white text-xs font-semibold px-4 py-2.5 rounded shadow transition flex items-center space-x-1.5">
                                <i class="fa-solid fa-plus text-orange-400"></i>
                                <span>Add New Product</span>
                            </button>
                        </div>

                        <div class="bg-white border border-slate-200 rounded shadow-xs overflow-hidden">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 text-slate-700 border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">SKU</th>
                                        <th class="p-3">Product Name</th>
                                        <th class="p-3">Category</th>
                                        <th class="p-3">Material</th>
                                        <th class="p-3">MOQ</th>
                                        <th class="p-3">Variants</th>
                                        <th class="p-3 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${products.map(p => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3 font-mono font-bold text-slate-600">${p.id}</td>
                                            <td class="p-3 font-bold text-navy">${p.name}</td>
                                            <td class="p-3">${p.category}</td>
                                            <td class="p-3 text-slate-600">${p.material}</td>
                                            <td class="p-3 font-semibold text-orange-600">${p.moq} Units</td>
                                            <td class="p-3">${p.variants.length} Options</td>
                                            <td class="p-3 text-right space-x-2">
                                                <button onclick="openProductModal('${p.id}')" class="text-navy hover:underline font-bold">Edit</button>
                                                <button onclick="deleteProduct('${p.id}')" class="text-red-600 hover:underline font-bold">Delete</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Add/Edit Product Modal -->
                    <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
                        <div class="bg-white rounded border border-slate-200 p-6 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto">
                            <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                                <h3 id="modal-title" class="font-bold text-navy text-sm uppercase tracking-wider">Add Wholesale Product</h3>
                                <button onclick="closeProductModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <form onsubmit="saveProduct(event)" class="space-y-3 text-xs">
                                <input type="hidden" id="form-prod-id">
                                <div>
                                    <label class="block text-slate-700 font-bold mb-1">Product Name *</label>
                                    <input type="text" id="form-name" required class="w-full bg-slate-50 border border-slate-300 rounded p-2 outline-none focus:border-navy">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-slate-700 font-bold mb-1">Category *</label>
                                        <select id="form-category" class="w-full bg-slate-50 border border-slate-300 rounded p-2 outline-none focus:border-navy">
                                            <option value="Safety Products">Safety Products</option>
                                            <option value="Garments & Textiles">Garments & Textiles</option>
                                            <option value="Industrial Supplies">Industrial Supplies</option>
                                            <option value="Packaging Materials">Packaging Materials</option>
                                            <option value="Hardware & Tools">Hardware & Tools</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-slate-700 font-bold mb-1">MOQ (Units) *</label>
                                        <input type="number" id="form-moq" required min="1" value="25" class="w-full bg-slate-50 border border-slate-300 rounded p-2 outline-none focus:border-navy">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-slate-700 font-bold mb-1">Material Specification *</label>
                                    <input type="text" id="form-material" required placeholder="e.g. ABS Plastic" class="w-full bg-slate-50 border border-slate-300 rounded p-2 outline-none focus:border-navy">
                                </div>
                                <div>
                                    <label class="block text-slate-700 font-bold mb-1">Short Description *</label>
                                    <textarea id="form-shortdesc" required rows="2" class="w-full bg-slate-50 border border-slate-300 rounded p-2 outline-none focus:border-navy"></textarea>
                                </div>
                                <div>
                                    <label class="block text-slate-700 font-bold mb-1">Full Technical Description *</label>
                                    <textarea id="form-desc" required rows="3" class="w-full bg-slate-50 border border-slate-300 rounded p-2 outline-none focus:border-navy"></textarea>
                                </div>
                                <div class="pt-3 border-t border-slate-200 flex justify-end space-x-2">
                                    <button type="button" onclick="closeProductModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded">Cancel</button>
                                    <button type="submit" class="bg-navy text-white px-4 py-2 rounded font-semibold">Save Product</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }

            /* --- VIEW: CATEGORIES MANAGEMENT --- */
            renderCategoriesView() {
                const categories = this.getCategories();

                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <div>
                                <h2 class="text-xl font-bold text-navy tracking-tight">Wholesale Categories Directory</h2>
                                <p class="text-xs text-slate-500 mt-0.5">Organize product lines and commercial sectors.</p>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded shadow-xs overflow-hidden">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 text-slate-700 border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Category Name</th>
                                        <th class="p-3">Description</th>
                                        <th class="p-3">Products Count</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${categories.map(c => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3 font-bold text-navy">${c.name}</td>
                                            <td class="p-3 text-slate-600">${c.desc}</td>
                                            <td class="p-3 font-semibold text-orange-600">${c.count} Items</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            /* --- VIEW: RFQS MANAGEMENT --- */
            renderRfqsView() {
                const rfqs = this.getRfqs();
                const filtered = this.rfqFilter === 'All' ? rfqs : rfqs.filter(r => r.status === this.rfqFilter);

                return `
                    <div class="space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h2 class="text-xl font-bold text-navy tracking-tight">Quotation Requests (RFQs) Management</h2>
                                <p class="text-xs text-slate-500 mt-0.5">Review client business requirements, view item breakdowns, and update quotation statuses.</p>
                            </div>
                            <div class="flex items-center space-x-2 text-xs">
                                <span class="font-bold text-slate-600">Filter Status:</span>
                                <select onchange="admin.rfqFilter = this.value; admin.render();" class="bg-white border border-slate-300 rounded px-2.5 py-1.5 font-medium outline-none focus:border-navy">
                                    <option value="All" ${this.rfqFilter==='All'?'selected':''}>All RFQs (${rfqs.length})</option>
                                    <option value="Pending" ${this.rfqFilter==='Pending'?'selected':''}>Pending</option>
                                    <option value="Reviewed" ${this.rfqFilter==='Reviewed'?'selected':''}>Reviewed</option>
                                    <option value="Quoted" ${this.rfqFilter==='Quoted'?'selected':''}>Quoted</option>
                                    <option value="Completed" ${this.rfqFilter==='Completed'?'selected':''}>Completed</option>
                                    <option value="Rejected" ${this.rfqFilter==='Rejected'?'selected':''}>Rejected</option>
                                </select>
                            </div>
                        </div>

                        ${filtered.length === 0 ? `
                            <div class="bg-white p-12 text-center rounded border border-slate-200">
                                <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-2"></i>
                                <h3 class="font-bold text-navy text-sm">No RFQs Found</h3>
                                <p class="text-xs text-slate-500">There are no quotation requests with status "${this.rfqFilter}".</p>
                            </div>
                        ` : `
                            <div class="space-y-4">
                                ${filtered.map(r => `
                                    <div class="bg-white border border-slate-200 rounded p-6 shadow-xs space-y-4">
                                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-200 pb-3">
                                            <div>
                                                <span class="font-mono font-bold text-navy text-sm mr-2">${r.id}</span>
                                                <span class="text-xs text-slate-500">Submitted: ${r.date}</span>
                                            </div>
                                            <div class="flex items-center space-x-2">
                                                <label class="text-xs font-bold text-slate-700">Status:</label>
                                                <select onchange="updateRfqStatus('${r.id}', this.value)" class="bg-slate-50 border border-slate-300 rounded p-1.5 text-xs font-bold outline-none focus:border-navy">
                                                    <option value="Pending" ${r.status==='Pending'?'selected':''}>Pending</option>
                                                    <option value="Reviewed" ${r.status==='Reviewed'?'selected':''}>Reviewed</option>
                                                    <option value="Quoted" ${r.status==='Quoted'?'selected':''}>Quoted</option>
                                                    <option value="Completed" ${r.status==='Completed'?'selected':''}>Completed</option>
                                                    <option value="Rejected" ${r.status==='Rejected'?'selected':''}>Rejected</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
                                            <div>
                                                <strong class="text-slate-700 block mb-1 uppercase tracking-wider text-[11px]">Company / Contact</strong>
                                                <div class="font-bold text-navy text-sm">${r.company}</div>
                                                <div class="text-slate-700 mt-0.5"><i class="fa-solid fa-user mr-1 text-slate-400"></i> ${r.contact}</div>
                                                <div class="text-slate-700"><i class="fa-solid fa-phone mr-1 text-slate-400"></i> ${r.mobile}</div>
                                                <div class="text-slate-700"><i class="fa-solid fa-envelope mr-1 text-slate-400"></i> ${r.email}</div>
                                                <div class="text-slate-500 mt-1">GSTIN: <strong class="text-slate-700">${r.gst}</strong></div>
                                            </div>

                                            <div>
                                                <strong class="text-slate-700 block mb-1 uppercase tracking-wider text-[11px]">Destination & Requirements</strong>
                                                <div class="text-slate-600 bg-slate-50 p-2.5 rounded border border-slate-200 mb-2">
                                                    <i class="fa-solid fa-location-dot text-orange-600 mr-1"></i> ${r.address}
                                                </div>
                                                <div class="text-slate-600">
                                                    <strong class="text-slate-700">Client Note:</strong> ${r.message}
                                                </div>
                                            </div>

                                            <div>
                                                <strong class="text-slate-700 block mb-1 uppercase tracking-wider text-[11px]">Requested Products (${r.items.length})</strong>
                                                <div class="space-y-1.5 max-h-36 overflow-y-auto">
                                                    ${r.items.map(i => `
                                                        <div class="bg-slate-50 p-2 rounded border border-slate-200">
                                                            <div class="font-bold text-navy">${i.name}</div>
                                                            <div class="text-[11px] text-slate-500">Variant: ${i.variant} | Qty: <strong class="text-orange-600">${i.quantity} Units</strong></div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                `;
            }
        }

        const admin = new AdminController();

        /* ==========================================================
           HANDLERS & ACTIONS
           ========================================================== */

        function handleLoginSubmit(event) {
            event.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;

            if (u === 'admin' && p === 'admin@123456789') {
                sessionStorage.setItem('ks_admin_auth', 'true');
                showToast('Authentication successful. Welcome, Admin.');
                admin.render();
            } else {
                showToast('Access Denied: Invalid credentials.', 'error');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('ks_admin_auth');
            showToast('Logged out successfully.');
            admin.render();
        }

        function updateRfqStatus(rfqId, newStatus) {
            const rfqs = admin.getRfqs();
            const r = rfqs.find(x => x.id === rfqId);
            if (r) {
                r.status = newStatus;
                admin.saveRfqs(rfqs);
                showToast(`RFQ ${rfqId} updated to "${newStatus}".`);
            }
        }

        function openProductModal(productId = null) {
            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            if (productId) {
                const products = admin.getProducts();
                const p = products.find(x => x.id === productId);
                document.getElementById('modal-title').innerText = 'Edit Product: ' + p.id;
                document.getElementById('form-prod-id').value = p.id;
                document.getElementById('form-name').value = p.name;
                document.getElementById('form-category').value = p.category;
                document.getElementById('form-moq').value = p.moq;
                document.getElementById('form-material').value = p.material;
                document.getElementById('form-shortdesc').value = p.shortDesc;
                document.getElementById('form-desc').value = p.description;
            } else {
                document.getElementById('modal-title').innerText = 'Add New Wholesale Product';
                document.getElementById('form-prod-id').value = '';
                document.getElementById('form-name').value = '';
                document.getElementById('form-category').value = 'Safety Products';
                document.getElementById('form-moq').value = '25';
                document.getElementById('form-material').value = '';
                document.getElementById('form-shortdesc').value = '';
                document.getElementById('form-desc').value = '';
            }
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            if (modal) modal.classList.add('hidden');
        }

        function saveProduct(event) {
            event.preventDefault();
            const id = document.getElementById('form-prod-id').value;
            const products = admin.getProducts();

            const name = document.getElementById('form-name').value;
            const category = document.getElementById('form-category').value;
            const moq = parseInt(document.getElementById('form-moq').value);
            const material = document.getElementById('form-material').value;
            const shortDesc = document.getElementById('form-shortdesc').value;
            const description = document.getElementById('form-desc').value;

            if (id) {
                const p = products.find(x => x.id === id);
                if (p) {
                    p.name = name;
                    p.category = category;
                    p.moq = moq;
                    p.material = material;
                    p.shortDesc = shortDesc;
                    p.description = description;
                }
                showToast('Product updated successfully.');
            } else {
                const newId = 'PROD-' + Math.floor(100 + Math.random() * 900);
                products.push({
                    id: newId,
                    name: name,
                    category: category,
                    subcategory: 'General Wholesale',
                    moq: moq,
                    shortDesc: shortDesc,
                    description: description,
                    material: material,
                    image: 'https://placehold.co/600x450/0F2C59/FFFFFF?text=' + encodeURIComponent(name),
                    variants: [{ size: 'Standard', color: 'Default', material: material }],
                    featured: false
                });
                showToast('New product added to catalog.');
            }

            admin.saveProducts(products);
            closeProductModal();
            admin.render();
        }

        function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            let products = admin.getProducts();
            products = products.filter(p => p.id !== productId);
            admin.saveProducts(products);
            showToast('Product deleted.');
            admin.render();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded shadow-lg text-xs font-medium text-white transition transform translate-y-2 opacity-0 flex items-center space-x-2 ${type === 'success' ? 'bg-navy border-l-4 border-orange-500' : 'bg-slate-800 border-l-4 border-red-500'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-orange-400' : 'fa-circle-exclamation text-red-400'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Initialize on load
        window.onload = function() {
            admin.render();
        };
    </script>
</body>
</html>
